<svg width="1242" height="2436" viewBox="0 0 1242 2436" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1242" height="2436" fill="#0A1628"/>
  
  <!-- Center Circle - Vinyl/Technology -->
  <circle cx="621" cy="1018" r="360" fill="none" stroke="#00D4AA" stroke-width="8" stroke-dasharray="20 10"/>
  <circle cx="621" cy="1018" r="300" fill="none" stroke="#00D4AA" stroke-width="4" opacity="0.5"/>
  <circle cx="621" cy="1018" r="240" fill="#141E33"/>
  
  <!-- Waveform Animation -->
  <path d="M421 1018 L481 958 L541 1078 L601 938 L661 1078 L721 958 L781 1018" stroke="#00D4AA" stroke-width="20" stroke-linecap="round" fill="none"/>
  
  <!-- Text: PRISTINE AUDIO -->
  <text x="621" y="1350" font-family="System" font-size="72" font-weight="700" fill="#F0F4F8" text-anchor="middle">PRISTINE</text>
  <text x="621" y="1450" font-family="System" font-size="72" font-weight="700" fill="#00D4AA" text-anchor="middle">AUDIO</text>
  
  <!-- Tagline -->
  <text x="621" y="1600" font-family="System" font-size="36" font-weight="400" fill="#C8D4E0" text-anchor="middle">High-Fidelity Audio Experience</text>
  
  <!-- Animated Dots (akan dianimasikan native) -->
  <circle cx="521" cy="1800" r="12" fill="#00D4AA">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="621" cy="1800" r="12" fill="#00D4AA">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.3s" repeatCount="indefinite" />
  </circle>
  <circle cx="721" cy="1800" r="12" fill="#00D4AA">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Bottom Gradient Wave -->
  <path d="M0 2136 Q310 2016 621 2136 T1242 2136" stroke="#00D4AA" stroke-width="4" fill="none" opacity="0.3"/>
  <path d="M0 2236 Q310 2116 621 2236 T1242 2236" stroke="#00D4AA" stroke-width="4" fill="none" opacity="0.2"/>
</svg>