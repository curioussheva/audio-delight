image: reactnativecommunity/react-native-android:latest

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "27.1.12297006"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - .gradle/

stages:
  - build

build-apk:
  stage: build
  before_script:
    - echo "Installing dependencies..."
    - yarn install --frozen-lockfile --ignore-engines
    - npx patch-package
    - echo "Downloading Oboe 1.9.0..."
    - mkdir -p android/app/src/main/cpp/oboe
    - curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz -o oboe.tar.gz
    - tar -xzf oboe.tar.gz --strip-components=1 -C android/app/src/main/cpp/oboe
    - rm oboe.tar.gz
    - echo "Oboe files $(ls android/app/src/main/cpp/oboe | wc -l)"
  script:
    - echo "Installing NDK and CMake..."
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" || true
    - export PATH=$ANDROID_HOME/cmake/3.22.1/bin:$PATH
    - cd android
    - chmod +x gradlew
    - rm -rf app/.cxx
    - ./gradlew assembleDebug
        --no-daemon
        --no-parallel
        --max-workers=2
        -PnewArchEnabled=true
        -PkotlinVersion=2.0.21
        -Pandroid.injected.build.abi.filters=arm64-v8a
        -Dorg.gradle.jvmargs="-Xmx3g -Xms512m"
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  only:
    - pristine-audio
