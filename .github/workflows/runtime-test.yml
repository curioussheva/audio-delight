name: Runtime Test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-test:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development
      EXPO_NO_DEV_SERVER: 1

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # 2. Setup Node + PNPM (dengan cache)
      # ============================================
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ============================================
      # 3. Install dependencies
      # ============================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ============================================
      # 4. Setup Java + Android SDK
      # ============================================
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # ============================================
      # 5. Install NDK + CMake
      # ============================================
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # ============================================
      # 6. Install nasm
      # ============================================
      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      # ============================================
      # 7. Cache FFmpeg
      # ============================================
      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/libs/ffmpeg
          key: ffmpeg-android-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      # ============================================
      # 8. Build FFmpeg
      # ============================================
      - name: Build FFmpeg for Android
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh

      # ============================================
      # 9. Configure local.properties
      # ============================================
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          sdk.dir=$ANDROID_HOME
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # ============================================
      # 10. Inject Gradle init script
      # ============================================
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # ============================================
      # 11. Patch RN Gradle Plugin
      # ============================================
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # ============================================
      # 12. Setup Oboe
      # ============================================
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # ============================================
      # 13. Clean all caches
      # ============================================
      - name: Clean all caches
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean || true
          rm -rf app/.cxx
          rm -rf app/build/.cxx
          rm -rf app/build/generated
          rm -rf app/build/intermediates
          rm -rf app/src/main/assets/index.android.bundle
          echo "✅ All caches cleaned"

      # ============================================
      # 14. Generate Codegen
      # ============================================
      - name: Generate Codegen
        working-directory: android
        run: |
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            --rerun-tasks \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true

      # ============================================
      # 15. Generate Autolinking
      # ============================================
      - name: Run generateAutolinkingNewArchitectureFiles
        working-directory: android
        run: |
          ./gradlew generateAutolinkingNewArchitectureFiles \
            --no-daemon \
            --rerun-tasks \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true

      # ============================================
      # 16. Export & embed Expo bundle
      # ============================================
      - name: Export & embed Expo bundle
        run: |
          echo "📦 Exporting Expo bundle..."
          npx expo export --platform android --output-dir dist --dev true

          rm -rf android/app/src/main/assets/*
          mkdir -p android/app/src/main/assets

          BUNDLE_FILE=$(find dist/_expo/static/js/android -name "*.js" | head -1)
          if [ -n "$BUNDLE_FILE" ]; then
            cp "$BUNDLE_FILE" android/app/src/main/assets/index.android.bundle
            echo "✅ Bundle copied from $BUNDLE_FILE"
            BUNDLE_SIZE=$(wc -c < android/app/src/main/assets/index.android.bundle)
            echo "✅ Bundle size: $BUNDLE_SIZE bytes"

            if grep -q "DUMMY" android/app/src/main/assets/index.android.bundle; then
              echo "✅ 'DUMMY' found in bundle — kode terbaru ter-embed!"
            else
              echo "⚠️ 'DUMMY' NOT found — bundle mungkin masih lama"
              head -5 android/app/src/main/assets/index.android.bundle
            fi
          else
            echo "❌ Bundle not found!"
            find dist -name "*.js" || true
            exit 1
          fi

      # ============================================
      # 17. Build Debug APK (TANPA flag dev server)
      # ============================================
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true
          # Biarkan default: dev server enabled agar resource tersedia,
          # tapi bundle tetap dari assets sehingga app tidak connect ke Metro.

      # ============================================
      # 18. Enable KVM
      # ============================================
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # ============================================
      # 19. Run on emulator & capture logs
      # ============================================
      - name: Run on emulator & capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none -memory 2048
          script: ./scripts/test-emulator.sh

      # ============================================
      # 20. Upload artifacts
      # ============================================
      - name: Upload Logcat Full
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logcat-Full
          path: logcat-full.log
          retention-days: 7

      - name: Upload Audio Debug Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Audio-Debug-Log
          path: audio-debug.log
          retention-days: 7

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-Log
          path: android/build.log
          retention-days: 7

      - name: Upload Bundle Verification
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bundle-Verification
          path: android/app/src/main/assets/index.android.bundle
          retention-days: 7 