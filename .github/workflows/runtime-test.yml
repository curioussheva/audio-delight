name: Runtime Test

on:
  workflow_dispatch:

jobs:
  runtime-test:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup Node + PNPM
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 4. Setup Java + Android SDK
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # 5. Install NDK + CMake
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # 6. Install nasm (required by FFmpeg)
      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      # 7. Cache FFmpeg build
      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/libs/ffmpeg
          key: ffmpeg-android-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      # 8. Build FFmpeg for Android (only if cache missed)
      - name: Build FFmpeg for Android
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh

      # 9. Configure Android paths
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          sdk.dir=$ANDROID_HOME
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # 10. Inject Gradle init script (RN + Expo fix)
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # 11. Patch RN Gradle Plugin (fix foojay bug)
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # 12. Setup Oboe
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # 13. Generate Codegen
      - name: Generate Codegen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true

      # 14. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes | tee build.log

      # 15. Run on emulator
      - name: Run on emulator
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          cores: 2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off -no-metrics -camera-back none -camera-front none -memory 2048
          script: |
            adb wait-for-device
            sleep 5
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -a android.intent.action.VIEW -d "pristineaudio://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081" com.pristineaudio.app
            sleep 30

            # Simpan log lengkap
            adb logcat -d > logcat-full.log

            # Simpan log audio spesifik
            adb logcat -d -s FFmpegDecoder:V PlaybackController:V AudioCallback:V NativePlaybackModule:V PlaybackNativeBridge:V NativePlaybackService:V > audio-debug.log

            echo "=== PlatformConstants ==="
            grep -B 5 -A 20 "PlatformConstants" logcat-full.log || echo "No PlatformConstants errors"
            echo "=== UnsatisfiedLinkError ==="
            grep -B 5 -A 20 "UnsatisfiedLinkError" logcat-full.log || echo "No UnsatisfiedLinkError"
            echo "=== TurboModule ==="
            grep -B 5 -A 20 "TurboModule" logcat-full.log | head -100 || echo "No TurboModule errors"

      # 16. Upload Logcat Full
      - name: Upload Logcat Full
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logcat-Full
          path: logcat-full.log

      # 17. Upload Audio Debug Log
      - name: Upload Audio Debug Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Audio-Debug-Log
          path: audio-debug.log 