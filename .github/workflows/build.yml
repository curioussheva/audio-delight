name: Build PristineAudio APK (Debug)

on:
  # on: push dimatikan sementara selama investigasi libappmodules.so /
  # PlatformConstants — pakai Autolinking Debug workflow (workflow_dispatch)
  # untuk iterasi cepat, dan workflow_dispatch di sini kalau perlu full build.
  # push:
  #   branches: ["pristinev2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # 2. Setup Node + PNPM (without cache)
      # ============================================
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================
      # 3. Install dependencies
      # ============================================
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Fix native bindings
      - name: Rebuild native deps
        run: pnpm rebuild @shopify/react-native-skia

      # ============================================
      # 4. Patch RN Gradle Plugin (fix foojay bug)
      # ============================================
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # ============================================
      # 5. Verify Gradle plugins exist
      # ============================================
      - name: Verify Gradle plugin paths
        run: |
          set -e
          test -f node_modules/@react-native/gradle-plugin/build.gradle.kts
          test -f node_modules/expo-modules-autolinking/android/expo-gradle-plugin/build.gradle.kts
          echo "✅ Gradle plugins OK"

      # ============================================
      # 6. Setup Java + Android SDK
      # ============================================
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # ============================================
      # 7. Install NDK + CMake
      # ============================================
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # ============================================
      # 8. Install nasm (required by FFmpeg)
      # ============================================
      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      # ============================================
      # 9. Cache FFmpeg build
      # ============================================
      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/libs/ffmpeg
          key: ffmpeg-android-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      # ============================================
      # 10. Build FFmpeg for Android (only if cache missed)
      # ============================================
      - name: Build FFmpeg for Android
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-ffmpeg-android.sh

      # ============================================
      # 11. Configure local.properties
      # ============================================
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          sdk.dir=$ANDROID_HOME
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # ============================================
      # 12. Verify SDK tools (debug helper)
      # ============================================
      - name: Verify CMake & NDK
        run: |
          echo "NDK:"
          ls -la $ANDROID_HOME/ndk
          echo "CMake:"
          ls -la $ANDROID_HOME/cmake

      # ============================================
      # 13. Inject Gradle init script
      # ============================================
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # ============================================
      # 14. Setup Oboe (native audio)
      # ============================================
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # ============================================
      # 15. Clean native cache
      # ============================================
      - name: Clean native cache
        run: |
          rm -rf node_modules/react-native-worklets/android/.cxx
          rm -rf node_modules/react-native-worklets/android/build
          rm -rf android/.cxx
          rm -rf android/build

      # ============================================
      # 16. Apply patches
      # ============================================

      - name: Patch AndroidManifest
        run: |
          find node_modules -path "*/android/src/main/AndroidManifest.xml" \
            -exec sed -i 's/ package="[^"]*"//g' {} +
          echo "✅ Manifest patched"

      - name: Verify RNTP patch
        run: |
          grep -q "nativeInitEngine" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/AudioPlayer.kt
          echo "✅ RNTP patch verified"

      # ============================================
      # 17. Generate Codegen
      # ============================================
      - name: Generate Codegen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true

      # ============================================
      # 18. Clean after codegen
      # ============================================
      - name: Clean after codegen
        run: rm -rf android/.cxx

      - name: Gradle clean
        working-directory: android
        run: ./gradlew clean

      # ============================================
      # 19. Build APK
      # ============================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes | tee build.log

      # ============================================
      # 20. Locate autolinking-generated artifacts (post-build)
      # ============================================
      - name: Locate autolinking artifacts
        if: always()
        working-directory: android
        run: |
          echo "=== Searching for autolinking output ==="
          find app/build -iname "*autolink*" 2>/dev/null || echo "none found"
          echo ""
          echo "=== Searching for Android-autolinking.cmake anywhere ==="
          find . -iname "Android-autolinking.cmake" 2>/dev/null || echo "none found"
          echo ""
          echo "=== Full tree of build/generated (depth 5) ==="
          find app/build/generated -maxdepth 5 2>/dev/null || echo "app/build/generated does not exist"
          echo ""
          echo "=== Searching for appmodules references anywhere in build ==="
          grep -rl "appmodules" app/build 2>/dev/null || echo "none found"
          echo ""
          echo "=== generateAutolinkingNewArchitectureFiles task in build.log ==="
          grep -n "generateAutolinkingNewArchitectureFiles\|Autolinking" build.log || echo "task not found in build.log"

      # ============================================
      # 21. Verify JS bundling task actually ran
      # ============================================
      - name: Verify JS bundle task ran
        run: |
          echo "=== Looking for bundle/export:embed task in build.log ==="
          grep -iE "bundleDebugJsAndAssets|export:embed|createBundle" android/build.log || echo "WARNING: no JS bundling task found in build.log"
          echo ""
          echo "=== Checking for embedded bundle output ==="
          find android/app/build -iname "*.bundle" -o -iname "index.android.bundle" 2>/dev/null || echo "WARNING: no bundle output file found"

      # ============================================
      # 22. Show Kotlin errors (on failure)
      # ============================================
      - name: Show Kotlin errors
        if: failure()
        run: |
          echo "=== Kotlin errors (e:) from build.log ==="
          grep -E "^e:" android/build.log || echo "No 'e:' errors found"
          echo ""
          echo "=== Kotlin compiler error files ==="
          find android/app/build -name "*.log" -exec grep -l "error" {} \; 2>/dev/null | head -10
          echo ""
          echo "=== Error context from build.log ==="
          grep -B 2 -A 5 "compilation error\|Unresolved reference\|Type mismatch\|Cannot access" android/build.log | head -80 || echo "No specific error patterns found"

      # ============================================
      # 23. Show Kotlin compiler reports (on failure)
      # ============================================
      - name: Show Kotlin compiler reports
        if: failure()
        run: |
          echo "=== Gradle problems report ==="
          find android/build -name "*.html" -path "*problems*" 2>/dev/null | head -5
          echo ""
          echo "=== Kotlin reports directory ==="
          find android/app/build -path "*kotlin*" -type d 2>/dev/null | head -10

      # ============================================
      # 24. Check TurboModule issues
      # ============================================
      - name: Check TurboModule issues
        if: always()
        run: |
          echo "=== TurboModule related warnings ==="
          grep -iE "turbomodule|platformconstants|newarch|reactmodule" android/build.log || echo "No TurboModule warnings found"
          echo ""
          echo "=== Module registration issues ==="
          grep -iE "moduleregistry|package.*register|ReactPackage|BaseReactPackage" android/build.log || echo "No module registration issues found"
          echo ""
          echo "=== JNI / native library issues ==="
          grep -iE "System.loadLibrary|UnsatisfiedLinkError|JNI_OnLoad|native library" android/build.log || echo "No JNI/native library issues found"

      # ============================================
      # 25. Verify APK exists
      # ============================================
      - name: Verify APK exists
        if: success()
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # ============================================
      # 26. Start Metro dev server in background
      # ============================================
      - name: Start Metro
        if: success()
        run: |
          nohup npx expo start --port 8081 > metro.log 2>&1 &
          echo "Metro starting, waiting for it to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8081/status > /dev/null 2>&1; then
              echo "Metro is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8081/status || echo "WARNING: Metro did not respond to /status"

      # ============================================
      # 27. Run on emulator and capture logcat
      # ============================================
      - name: Run on emulator
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          cores: 2
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off -no-metrics -camera-back none -camera-front none -memory 2048
          script: |
            adb wait-for-device
            sleep 5
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            echo "=== List installed package ==="
            adb shell pm list packages | grep -i pristine
            echo ""
            echo "=== Resolve activity name ==="
            adb shell cmd package resolve-activity --brief com.pristineaudio.app
            echo ""
            echo "=== Start app via deep link (mimics tapping Connect in Dev Launcher) ==="
            adb shell am start -a android.intent.action.VIEW -d "pristineaudio://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081" com.pristineaudio.app

            echo ""
            echo "=== Polling for activity resumed state (up to 120s) ==="
            bash -c 'RESUMED=""; for i in $(seq 1 12); do sleep 10; if adb shell dumpsys activity activities 2>/dev/null | grep -q "mResumedActivity.*com.pristineaudio.app"; then echo "Activity resumed after ~${i}0s"; RESUMED="yes"; break; fi; echo "...still waiting (${i}0s elapsed)"; done; if [ -z "$RESUMED" ]; then echo "Activity never reached resumed state within 120s"; fi'

            echo ""
            echo "=== mResumedActivity dump ==="
            adb shell dumpsys activity activities 2>/dev/null | grep -A5 "mResumedActivity" || echo "No mResumedActivity info"

            echo ""
            echo "=== Extra wait for JS bundle to finish loading (60s) ==="
            sleep 60

            echo ""
            echo "=== Extra wait for JS bundle to finish loading (60s) ==="
            sleep 60

            echo ""
            echo "=== Process check ==="
            bash -c 'APP_PID=$(adb shell pidof -s com.pristineaudio.app || true); echo "App PID: ${APP_PID:-not running}"; echo "$APP_PID" > /tmp/app_pid.txt'

            adb logcat -d > logcat-full.log || true

            echo ""
            echo "=== Process-specific log (app PID only) ==="
            bash -c 'APP_PID=$(cat /tmp/app_pid.txt 2>/dev/null); if [ -n "$APP_PID" ]; then adb logcat -d --pid="$APP_PID" > logcat-app-only.log || true; tail -200 logcat-app-only.log; else echo "App process not found - likely crashed or never started. Falling back to full log tail."; tail -200 logcat-full.log; fi'

            echo ""
            echo "=== PlatformConstants errors ==="
            grep -B 5 -A 20 "PlatformConstants" logcat-full.log || echo "No PlatformConstants errors"
            echo ""
            echo "=== TurboModule errors ==="
            grep -B 5 -A 20 "TurboModule" logcat-full.log | head -100 || echo "No TurboModule errors"
            echo ""
            echo "=== FATAL errors ==="
            grep -B 2 -A 10 "FATAL\|AndroidRuntime" logcat-full.log | head -80 || echo "No FATAL errors"
            echo ""
            echo "=== ReactNativeJS errors ==="
            grep -B 2 -A 10 "ReactNativeJS" logcat-full.log | head -80 || echo "No JS errors"

      - name: Upload Logcat Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Logcat-Output
          path: logcat-full.log

      # ============================================
      # 28. Upload Metro log
      # ============================================
      - name: Upload Metro log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Metro-Log
          path: metro.log

      # ============================================
      # 29. Upload logs
      # ============================================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Full-Build-Log
          path: android/build.log

      - name: Extract warnings/errors
        if: always()
        run: |
          grep -E "warning|error|w:|e:" android/build.log > android/build-issues.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Issues
          path: android/build-issues.log

      # ============================================
      # 30. Upload APK
      # ============================================
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          