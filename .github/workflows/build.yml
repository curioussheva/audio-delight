name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristine-audio"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # STEP 1: Free Disk Space
      # ============================================
      - name: Free Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3[0-2]*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6]* sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h

      # ============================================
      # STEP 2: Checkout Code
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      # ============================================
      # STEP 3: Setup Oboe 1.9.0
      # ============================================
      - name: Setup Oboe 1.9.0
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz -o oboe.tar.gz
          tar -xzf oboe.tar.gz --strip-components=1 -C "$OBOE_DIR"
          rm oboe.tar.gz
          echo "Oboe files: $(ls $OBOE_DIR | wc -l)"
          head -3 "$OBOE_DIR/CMakeLists.txt"

      # ============================================
      # STEP 4: Setup Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      # ============================================
      # STEP 5: Install Dependencies
      # ============================================
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      # ============================================
      # STEP 6: Apply Patches & Verify Environment
      # ============================================
      - name: Apply patches & Verify
        run: |
          npx patch-package
          echo "Verifying patches applied..."

          # Verifikasi Babel Plugin untuk Reanimated
          if grep -q "react-native-reanimated/plugin" babel.config.js; then
            echo "✅ Babel plugin found for Reanimated v4"
          else
            echo "❌ Babel plugin missing - this will break Reanimated v4!"
            exit 1
          fi

          # Verifikasi AudioPlayer.kt
          if grep -q "OboeAudioProcessor" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/AudioPlayer.kt; then
            echo "✅ AudioPlayer.kt patched"
          else
            echo "❌ AudioPlayer.kt NOT patched"
            exit 1
          fi

          # Verifikasi APMRenderersFactory.kt
          if [ -f node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/components/APMRenderersFactory.kt ]; then
            if grep -q "buildAudioSink" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/components/APMRenderersFactory.kt; then
              if grep -A 3 "override fun buildAudioSink" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/components/APMRenderersFactory.kt | grep -q "enableAudioOffload"; then
                echo "⚠️ Auto-patching APMRenderersFactory.kt to 3 parameters for Media3 1.6.1..."
                sed -i '/enableAudioOffload/d' node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/components/APMRenderersFactory.kt
                echo "✅ APMRenderersFactory.kt auto-patched"
              fi
            fi
          fi

      # ============================================
      # STEP 7: Verify AndroidManifest.xml
      # ============================================
      - name: Verify usesCleartextTraffic in AndroidManifest.xml
        run: |
          echo "Checking AndroidManifest.xml for usesCleartextTraffic..."
          if grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml; then
            echo "✅ usesCleartextTraffic found"
          else
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
            echo "✅ usesCleartextTraffic added manually"
          fi

      # ============================================
      # STEP 8: Setup JDK 17
      # ============================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # ============================================
      # STEP 9: Setup Android SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # STEP 10: Install NDK 27 and CMake 3.31.6
      # ============================================
      - name: Install NDK 27 and CMake 3.31.6
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> $GITHUB_PATH

      # ============================================
      # STEP 11: Set Environment Variables
      # ============================================
      - name: Set environment variables
        run: |
          echo "NODE_ENV=development" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      # ============================================
      # STEP 12: Build Debug APK (Strict New Arch)
      # ============================================
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew

          echo "🔥 Deep Cleaning Native Cache..."
          rm -rf app/.cxx build app/build ~/.gradle/caches/build-cache-*
          ./gradlew clean

          echo "⚙️ Generating TurboModule/Fabric Codegen Artifacts..."
          ./gradlew generateCodegenArtifactsFromSchema \
            -PnewArchEnabled=true \
            --no-daemon

          echo "🚀 Starting Full Clean Build..."
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PkotlinVersion=2.0.21 \
            -PforceBundle=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"
        env:
          NODE_ENV: development
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      # ============================================
      # STEP 13: Verify APK ABI Contents & New Arch
      # ============================================
      - name: Verify APK ABI contents
        run: |
          cd android
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "📦 Checking APK contents for New Architecture Core..."
          unzip -l $APK_PATH | grep -E "libpristineaudio_engine\.so|libfabricjni\.so|libturbomodulejsijni\.so|libreactnative\.so" || true
          
          echo "-----------------------------------"
          if unzip -l $APK_PATH | grep -q "libfabricjni.so"; then
            echo "✅ SUCCESS: libfabricjni.so found! App is running Full New Architecture."
          else
            echo "❌ WARNING: libfabricjni.so missing! New Architecture compilation failed."
            exit 1
          fi

      # ============================================
      # STEP 14: Upload Debug APK
      # ============================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ============================================
      # STEP 15: Upload AndroidManifest.xml
      # ============================================
      - name: Upload AndroidManifest.xml for verification
        uses: actions/upload-artifact@v4
        with:
          name: AndroidManifest-Debug
          path: android/app/src/main/AndroidManifest.xml
          retention-days: 7
