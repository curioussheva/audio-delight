name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristine-audio"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # STEP 1: Free Disk Space
      # ============================================
      - name: Free Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3[0-2]*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6]*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h

      # ============================================
      # STEP 2: Checkout Code
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      # ============================================
      # STEP 3: Setup Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "yarn"

      # ============================================
      # STEP 4: Install Dependencies
      # ============================================
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      # ============================================
      # STEP 5: Verify Gradle Plugin Paths
      # ============================================
      - name: Verify Gradle plugin paths
        run: |
          RN_PLUGIN="${{ github.workspace }}/node_modules/@react-native/gradle-plugin"
          EXPO_PLUGIN="${{ github.workspace }}/node_modules/expo/node_modules/expo-modules-autolinking/android/expo-gradle-plugin"

          echo "Checking @react-native/gradle-plugin..."
          ls "$RN_PLUGIN"/build.gradle* 2>/dev/null | grep -q "build.gradle" || {
            echo "❌ @react-native/gradle-plugin missing at $RN_PLUGIN"
            exit 1
          }
          echo "✅ @react-native/gradle-plugin found"

          echo "Checking expo-gradle-plugin..."
          ls "$EXPO_PLUGIN"/build.gradle* 2>/dev/null | grep -q "build.gradle" || {
            echo "❌ expo-gradle-plugin missing at $EXPO_PLUGIN"
            exit 1
          }
          echo "✅ expo-gradle-plugin found"

      # ============================================
      # STEP 6: Setup Oboe 1.9.0
      # ============================================
      - name: Setup Oboe 1.9.0
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz -o oboe.tar.gz
          tar -xzf oboe.tar.gz --strip-components=1 -C "$OBOE_DIR"
          rm oboe.tar.gz
          echo "✅ Oboe files: $(ls $OBOE_DIR | wc -l)"
          head -3 "$OBOE_DIR/CMakeLists.txt"

      # ============================================
      # STEP 7: Apply Patches
      # ============================================
      - name: Apply patches
        run: |
          npx patch-package
          echo "Verifying patches applied..."

          if grep -q "react-native-reanimated/plugin" babel.config.cjs; then
            echo "✅ Babel plugin found for Reanimated v4"
          else
            echo "❌ Babel plugin missing!"
            exit 1
          fi

          if grep -q "OboeAudioProcessor" \
            node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/AudioPlayer.kt; then
            echo "✅ AudioPlayer.kt patched"
          else
            echo "❌ AudioPlayer.kt NOT patched"
            exit 1
          fi

          APMF="node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/components/APMRenderersFactory.kt"
          if [ -f "$APMF" ]; then
            if grep -q "buildAudioSink" "$APMF"; then
              if grep -A 3 "override fun buildAudioSink" "$APMF" | grep -q "enableAudioOffload"; then
                echo "⚠️ Auto-patching APMRenderersFactory.kt for Media3 1.6.1..."
                sed -i '/enableAudioOffload/d' "$APMF"
                echo "✅ APMRenderersFactory.kt auto-patched"
              fi
            fi
          fi

      # ============================================
      # STEP 8: Patch @react-native/gradle-plugin
      # Removes foojay toolchain plugin from RN's
      # settings.gradle.kts — causes circular
      # dependency when loaded as includeBuild
      # ============================================
      - name: Patch @react-native/gradle-plugin settings
        run: |
          RN_SETTINGS="${{ github.workspace }}/node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          sed -i '/foojay-resolver-convention/d' "$RN_SETTINGS"
          echo "✅ Patched settings.gradle.kts:"
          cat "$RN_SETTINGS"

      # ============================================
      # STEP 9: Verify AndroidManifest.xml
      # ============================================
      - name: Verify usesCleartextTraffic in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            echo "✅ usesCleartextTraffic already present"
          else
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            echo "✅ usesCleartextTraffic added"
          fi

      # ============================================
      # STEP 10: Setup JDK 17
      # ============================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # ============================================
      # STEP 11: Setup Android SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================
      # STEP 12: Install NDK 27 and CMake 3.31.6
      # ============================================
      - name: Install NDK 27 and CMake 3.31.6
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> $GITHUB_PATH

      # ============================================
      # STEP 13: Inject Gradle Init Script
      # Runs BEFORE settings.gradle is parsed —
      # the only reliable way to inject includeBuild
      # for plugin resolution in Gradle 8.x
      # ============================================
      - name: Inject Gradle init script
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d

          RN_PLUGIN="${{ github.workspace }}/node_modules/@react-native/gradle-plugin"
          EXPO_PLUGIN="${{ github.workspace }}/node_modules/expo/node_modules/expo-modules-autolinking/android/expo-gradle-plugin"

          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${RN_PLUGIN}")
                  includeBuild("${EXPO_PLUGIN}")
              }
          }
          EOF

          echo "✅ Init script:"
          cat $GRADLE_USER_HOME/init.d/rn-plugins.gradle

      # ============================================
      # STEP 14: Generate Codegen Artifacts
      # ============================================
      - name: Generate Codegen Artifacts
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          chmod +x gradlew
          echo "🔧 Generating Codegen bindings for TurboModule..."
          
          # Generate Codegen artifacts
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PkotlinVersion=2.0.21 || {
            echo "⚠️ Codegen generation failed or not needed"
          }
          
          # Debug: Cari semua file Codegen
          echo "🔍 Searching for Codegen output..."
          find . -type f \( -name "*.h" -o -name "*.cpp" \) -path "*codegen*" 2>/dev/null | sort | head -30 || true
          
          # Cari PristineAudioSpec khususnya
          echo "🔍 Searching for PristineAudioSpec..."
          find . -name "*PristineAudio*" 2>/dev/null | head -20 || true
          
          # Cek direktori build/generated
          echo "📁 Listing build/generated..."
          ls -la app/build/generated/source/codegen/ 2>/dev/null || echo "⚠️ Codegen directory not found (may be expected)"

      # ============================================
      # STEP 15: Build Debug APK
      # ============================================
      - name: Build Debug APK
        working-directory: android
        env:
          NODE_ENV: development
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x gradlew

          echo "🔥 Deep Cleaning Native Cache..."
          rm -rf app/.cxx build app/build
          rm -rf $GRADLE_USER_HOME/caches/build-cache-*

          echo "🚀 Starting Full Clean Build..."
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PkotlinVersion=2.0.21 \
            -PforceBundle=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" || {
            echo "❌ Build failed, checking for partial outputs..."
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          }


      # ============================================
      # STEP 16: Upload Debug APK
      # ============================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ============================================
      # STEP 17: Upload AndroidManifest.xml
      # ============================================
      - name: Upload AndroidManifest.xml
        uses: actions/upload-artifact@v4
        with:
          name: AndroidManifest-Debug
          path: android/app/src/main/AndroidManifest.xml
          retention-days: 7
 