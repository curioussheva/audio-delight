name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristinev2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # 2. Setup Node + PNPM (without cache)
      # ============================================
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================
      # 3. Install dependencies (generate lockfile)
      # ============================================
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Fix native bindings
      - name: Rebuild native deps
        run: pnpm rebuild @shopify/react-native-skia

      # ============================================
      # 4. Patch RN Gradle Plugin (fix foojay bug)
      # ============================================
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # ============================================
      # 5. Verify Gradle plugins exist
      # ============================================
      - name: Verify Gradle plugin paths
        run: |
          set -e
          test -f node_modules/@react-native/gradle-plugin/build.gradle.kts
          test -f node_modules/expo-modules-autolinking/android/expo-gradle-plugin/build.gradle.kts
          echo "✅ Gradle plugins OK"

      # ============================================
      # 6. Setup Java + Android SDK
      # ============================================
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # ============================================
      # 7. Install NDK + CMake (STABLE)
      # ============================================
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # ============================================
      # 8. Configure local.properties
      # ============================================
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          ndk.dir=$ANDROID_HOME/ndk/27.1.12297006
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # ============================================
      # 9. Verify SDK tools (debug helper)
      # ============================================
      - name: Verify CMake & NDK
        run: |
          echo "NDK:"
          ls -la $ANDROID_HOME/ndk
          echo "CMake:"
          ls -la $ANDROID_HOME/cmake

      # ============================================
      # 10. Inject Gradle init (RN + Expo fix)
      # ============================================
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # ============================================
      # 11. Setup Oboe (native audio)
      # ============================================
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # ============================================
      # 12. Clean native cache
      # ============================================
      - name: Clean native cache
        run: |
          rm -rf node_modules/react-native-worklets/android/.cxx
          rm -rf node_modules/react-native-worklets/android/build
          rm -rf android/.cxx
          rm -rf android/build

      # ============================================
      # 13. Apply patches
      # ============================================
      - name: Apply PristineAudio patches
        run: bash scripts/patch-pristine.sh

      - name: Patch AndroidManifest
        run: |
          find node_modules -path "*/android/src/main/AndroidManifest.xml" \
            -exec sed -i 's/ package="[^"]*"//g' {} +
          echo "✅ Manifest patched"

      - name: Verify RNTP patch
        run: |
          grep -q "nativeInitEngine" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/AudioPlayer.kt
          echo "✅ RNTP patch verified"

      # ============================================
      # 14. Generate Codegen
      # ============================================
      - name: Generate Codegen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true

      # ============================================
      # 15. Clean after codegen
      # ============================================
      - name: Clean after codegen
        run: rm -rf android/.cxx

      - name: Gradle clean
        working-directory: android
        run: ./gradlew clean

      # ============================================
      # 16. Build APK
      # ============================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes | tee build.log

      # ============================================
      # 16b. Show Kotlin errors (on failure)
      # ============================================
      - name: Show Kotlin errors
        if: failure()
        run: |
          echo "=== Kotlin errors (e:) from build.log ==="
          grep -E "^e:" android/build.log || echo "No 'e:' errors found"
          echo ""
          echo "=== Kotlin compiler error files ==="
          find android/app/build -name "*.log" -exec grep -l "error" {} \; 2>/dev/null | head -10
          echo ""
          echo "=== Error context from build.log ==="
          grep -B 2 -A 5 "compilation error\|Unresolved reference\|Type mismatch\|Cannot access" android/build.log | head -80 || echo "No specific error patterns found"

      # ============================================
      # 16c. Show Kotlin compiler reports (on failure)
      # ============================================
      - name: Show Kotlin compiler reports
        if: failure()
        run: |
          echo "=== Gradle problems report ==="
          find android/build -name "*.html" -path "*problems*" 2>/dev/null | head -5
          echo ""
          echo "=== Kotlin reports directory ==="
          find android/app/build -path "*kotlin*" -type d 2>/dev/null | head -10

      # ============================================
      # 16d. Check TurboModule issues (Opsi 1)
      # ============================================
      - name: Check TurboModule issues
        if: always()
        run: |
          echo "=== TurboModule related warnings ==="
          grep -iE "turbomodule|platformconstants|newarch|reactmodule" android/build.log || echo "No TurboModule warnings found"
          echo ""
          echo "=== Module registration issues ==="
          grep -iE "moduleregistry|package.*register|ReactPackage|BaseReactPackage" android/build.log || echo "No module registration issues found"
          echo ""
          echo "=== JNI / native library issues ==="
          grep -iE "System.loadLibrary|UnsatisfiedLinkError|JNI_OnLoad|native library" android/build.log || echo "No JNI/native library issues found"

      # ============================================
      # 17. Verify APK exists
      # ============================================
      - name: Verify APK exists
        if: success()
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # ============================================
      # 18. Upload logs
      # ============================================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Full-Build-Log
          path: android/build.log

      - name: Extract warnings/errors
        if: always()
        run: |
          grep -E "warning|error|w:|e:" android/build.log > android/build-issues.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Issues
          path: android/build-issues.log

      # ============================================
      # 19. Upload APK
      # ============================================
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk 