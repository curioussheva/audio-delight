name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristine-audio"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup Node + PNPM
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3. Install deps (NO scripts → kita kontrol patch manual)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 4. Verify Gradle plugin (fail fast)
      - name: Verify Gradle plugin paths
        run: |
          set -e
          test -f node_modules/@react-native/gradle-plugin/build.gradle.kts
          test -f node_modules/expo-modules-autolinking/android/expo-gradle-plugin/build.gradle.kts
          echo "✅ Gradle plugins OK"

      # 5. Setup Java + Android
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # 6. Install NDK + CMake (pin exact)
      - name: Install NDK + CMake
        run: |
          set -e
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> $GITHUB_PATH

      # 7. Inject Gradle init (plugin include)
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # 8. Patch RN Gradle Plugin (fix foojay)
      - name: Patch RN Gradle Plugin
        run: |
          sed -i '/foojay-resolver-convention/d' node_modules/@react-native/gradle-plugin/settings.gradle.kts

      # 9. Setup Oboe
      - name: Setup Oboe
        run: |
          set -e
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # 10. Warmup Hermes (CORRECT)
      - name: Force Hermes Prefab Extraction
        working-directory: android
        run: |
         set -e
         chmod +x gradlew

         ./gradlew :app:assembleDebug \
         --no-daemon \
         -x lint \
         -x test \
         -PnewArchEnabled=true \
         -PreactNativeNewArch=true \
         -PhermesEnabled=true \
         -PkotlinVersion=2.0.21 || true

      # 11. Verify Hermes 
      - name: Verify Hermes AAR (non-prefab)
        run: |
         echo "🔍 Checking Hermes AAR..."
         find $GRADLE_USER_HOME -name "*hermes*.aar" | head -5

         test -n "$(find $GRADLE_USER_HOME -name '*hermes*.aar' -print -quit)" \
         || { echo "❌ Hermes AAR NOT found"; exit 1; }

         echo "✅ Hermes AAR OK"

      # 12. Apply patches (AFTER Hermes ready)
      - name: Apply PristineAudio patches
        run: |
          set -e
          bash scripts/patch-pristine.sh

      # 13. Verify patches
      - name: Verify patches applied
        run: |
          set -e
          grep -q "nativeInitEngine" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/AudioPlayer.kt
          grep -q "ReactAndroid::reactnative" node_modules/react-native-worklets/android/CMakeLists.txt
          echo "✅ Patches verified"

      # 14. Generate Codegen (safe optional)
      - name: Generate Codegen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -PkotlinVersion=2.0.21 || true

      # 15. Clean CMake cache (IMPORTANT)
      - name: Clean CMake cache
        run: |
          rm -rf node_modules/react-native-worklets/android/.cxx

      # 16. Build APK
      - name: Build Debug APK
        working-directory: android
        env:
          NODE_ENV: development
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -PkotlinVersion=2.0.21 \
            -Pandroid.prefabVersion=2.0.0

      # 17. Upload APK
      - uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 18. Upload Manifest
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidManifest-Debug
          path: android/app/src/main/AndroidManifest.xml 