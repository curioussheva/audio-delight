name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristinev2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # 2. Setup Node + PNPM
      # ============================================
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ============================================
      # 3. Install dependencies
      # ============================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fix native bindings
      - name: Rebuild native deps
        run: pnpm rebuild @shopify/react-native-skia

      # ============================================
      # 4. Patch RN Gradle Plugin (fix foojay bug)
      # ============================================
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # ============================================
      # 5. Verify Gradle plugins exist
      # ============================================
      - name: Verify Gradle plugin paths
        run: |
          set -e
          test -f node_modules/@react-native/gradle-plugin/build.gradle.kts
          test -f node_modules/expo-modules-autolinking/android/expo-gradle-plugin/build.gradle.kts
          echo "✅ Gradle plugins OK"

      # ============================================
      # 6. Setup Java + Android SDK
      # ============================================
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # ============================================
      # 7. Install NDK + CMake (STABLE)
      # ============================================
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # ============================================
      # 8. Configure local.properties
      # ============================================
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          ndk.dir=$ANDROID_HOME/ndk/27.1.12297006
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # ============================================
      # 9. Verify SDK tools (debug helper)
      # ============================================
      - name: Verify CMake & NDK
        run: |
          echo "NDK:"
          ls -la $ANDROID_HOME/ndk
          echo "CMake:"
          ls -la $ANDROID_HOME/cmake

      # ============================================
      # 10. Inject Gradle init (RN + Expo fix)
      # ============================================
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # ============================================
      # 11. Setup Oboe (native audio) - MOVED EARLY
      # ============================================
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          echo "⬇️  Downloading Oboe 1.9.0..."
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"
          
          echo "✅ Oboe extracted to $OBOE_DIR"
          echo "📁 Verifying Oboe structure:"
          ls -la "$OBOE_DIR/CMakeLists.txt" || { echo "❌ CMakeLists.txt not found!"; exit 1; }
          ls -la "$OBOE_DIR/include/" | head -5
          echo "✅ Oboe OK"

      # ============================================
      # 12. Clean native cache
      # ============================================
      - name: Clean native cache
        run: |
          rm -rf node_modules/react-native-worklets/android/.cxx
          rm -rf node_modules/react-native-worklets/android/build
          rm -rf android/.cxx
          rm -rf android/build

      # ============================================
      # 13. Apply patches (if any)
      # ============================================
      - name: Apply PristineAudio patches
        run: |
          if [ -f "scripts/patch-pristine.sh" ]; then
            bash scripts/patch-pristine.sh
            echo "✅ Patches applied"
          else
            echo "⚠️  No patch script found, skipping"
          fi

      - name: Patch AndroidManifest
        run: |
          find node_modules -path "*/android/src/main/AndroidManifest.xml" \
            -exec sed -i 's/ package="[^"]*"//g' {} + || true
          echo "✅ Manifest patched (or no manifests found)"

      # ============================================
      # 14. Clean and Gradle refresh
      # ============================================
      - name: Gradle clean
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon

      # ============================================
      # 15. Build APK (no codegen for pristinev2 - pure native)
      # ============================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=false \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes 2>&1 | tee build.log

      # ============================================
      # 16. Verify APK exists
      # ============================================
      - name: Verify APK exists
        if: success()
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully: $APK"
            ls -lh "$APK"
          else
            echo "❌ APK not found at $APK"
            exit 1
          fi

      # ============================================
      # 17. Upload logs
      # ============================================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Full-Build-Log
          path: android/build.log

      - name: Extract warnings/errors
        if: always()
        run: grep -E "warning|error|w:" android/build.log > android/build-issues.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Issues
          path: android/build-issues.log

      # ============================================
      # 18. Upload APK
      # ============================================
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
