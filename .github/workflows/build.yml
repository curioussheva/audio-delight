name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristine-audio"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Free Disk Space
      - name: Free Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3[0-2]*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6]*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h

      # STEP 2: Checkout Code
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 3: Setup Node.js (untuk CLI Expo/React Native)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # STEP 4: Yarn install (immutable, scripts disabled)
      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      # STEP 5: Apply PristineAudio patches (RNTP + Worklets)
      - name: Apply PristineAudio patches
        run: yarn patch
  
      # STEP 6: Verify Gradle Plugins
      - name: Verify Gradle plugin paths
        run: |
          RN_PLUGIN="node_modules/@react-native/gradle-plugin"
          EXPO_PLUGIN="node_modules/expo-modules-autolinking/android/expo-gradle-plugin"
          test -f "$RN_PLUGIN/build.gradle.kts" || { echo "❌ Missing RN gradle plugin"; exit 1; }
          test -f "$EXPO_PLUGIN/build.gradle.kts" || { echo "❌ Missing Expo gradle plugin"; exit 1; }
          echo "✅ Gradle plugins OK"

      # STEP 7: Setup Oboe 1.9.0
      - name: Setup Oboe 1.9.0
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz -o oboe.tar.gz
          tar -xzf oboe.tar.gz --strip-components=1 -C "$OBOE_DIR"
          rm oboe.tar.gz
          echo "✅ Oboe installed"

      # STEP 8: Patch RN Gradle Plugin
      - name: Patch @react-native/gradle-plugin
        run: |
          sed -i '/foojay-resolver-convention/d' node_modules/@react-native/gradle-plugin/settings.gradle.kts
          echo "✅ Patched RN gradle plugin"

      # STEP 9: Ensure usesCleartextTraffic
      - name: Ensure usesCleartextTraffic
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'usesCleartextTraffic' "$MANIFEST" || \
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          echo "✅ CleartextTraffic OK"

      # STEP 10: Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # STEP 11: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # STEP 12: Install NDK + CMake
      - name: Install NDK 27 + CMake 3.31.6
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> $GITHUB_PATH

      # STEP 13: Inject Gradle Init Script
      - name: Inject Gradle init script
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          RN_PLUGIN="${{ github.workspace }}/node_modules/@react-native/gradle-plugin"
          EXPO_PLUGIN="${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin"
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${RN_PLUGIN}")
                  includeBuild("${EXPO_PLUGIN}")
              }
          }
          EOF

      # STEP 14: Generate Codegen Artifacts
      - name: Generate Codegen Artifacts
        working-directory: android
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PkotlinVersion=2.0.21 || true

      # STEP 15: Build Debug APK
      - name: Build Debug APK
        working-directory: android
        env:
          NODE_ENV: development
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
        run: |
          chmod +x gradlew
          rm -rf app/.cxx build app/build
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PkotlinVersion=2.0.21 \
            -PforceBundle=true

      # STEP 16: Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # STEP 17: Upload AndroidManifest.xml
      - name: Upload AndroidManifest.xml
        uses: actions/upload-artifact@v4
        with:
          name: AndroidManifest-Debug
          path: android/app/src/main/AndroidManifest.xml
          retention-days: 7 