name: Build PristineAudio APK (Debug)

on:
  push:
    branches: ["pristine-audio"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development   # ✅ gunakan development, bukan production

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # 2. Setup Node + PNPM
      # ============================================
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ============================================
      # 3. Install dependencies
      # ============================================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fix Skia (native binding)
      - name: Fix Skia binaries
        run: pnpm rebuild @shopify/react-native-skia

      # ============================================
      # 4. Verify Gradle plugins
      # ============================================
      - name: Verify Gradle plugin paths
        run: |
          set -e
          test -f node_modules/@react-native/gradle-plugin/build.gradle.kts
          test -f node_modules/expo-modules-autolinking/android/expo-gradle-plugin/build.gradle.kts
          echo "✅ Gradle plugins OK"

      # ============================================
      # 5. Setup Java + Android SDK
      # ============================================
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # ============================================
      # 6. Install NDK + CMake
      # ============================================
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.31.6"

      - name: Force CMake version
        run: |
          echo "cmake.dir=$ANDROID_HOME/cmake/3.31.6" >> android/local.properties

      # ============================================
      # 7. Inject Gradle init (RN + Expo fix)
      # ============================================
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # ============================================
      # 8. Patch RN Gradle Plugin (CI fix)
      # ============================================
      - name: Patch RN Gradle Plugin
        run: |
          sed -i '/foojay-resolver-convention/d' node_modules/@react-native/gradle-plugin/settings.gradle.kts

      # ============================================
      # 9. Setup Oboe (native audio)
      # ============================================
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # ============================================
      # 🔥 10. Clean native cache
      # ============================================
      - name: Clean native cache
        run: |
          rm -rf node_modules/react-native-worklets/android/.cxx
          rm -rf android/.cxx
          rm -rf android/build

      # ============================================
      # 11. Apply RNTP patch ONLY
      # ============================================
      - name: Apply PristineAudio patches
        run: |
          set -e
          bash scripts/patch-pristine.sh

      # 🔥 Patch AndroidManifest (remove only package attr)
      - name: Patch AndroidManifest in node_modules
        run: |
         find node_modules -path "*/android/src/main/AndroidManifest.xml" \
         -exec sed -i 's/ package="[^"]*"//g' {} +
         echo "✅ Removed package attributes safely"

      # ============================================
      # 12. Verify RNTP patch
      # ============================================
      - name: Verify RNTP patch
        run: |
          set -e
          grep -q "nativeInitEngine" node_modules/react-native-track-player/android/src/main/java/com/lovegaoshi/kotlinaudio/player/AudioPlayer.kt
          echo "✅ RNTP patch verified"

      # ============================================
      # 13. Generate Codegen (Hermes)
      # ============================================
      - name: Generate Codegen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true 
            
      # ============================================
      # 🔥 14. Clean again (post-codegen)
      # ============================================
      - name: Clean native cache (post)
        run: |
          rm -rf android/.cxx

      # ============================================
      # 15. Build APK (Hermes)
      # ============================================
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes

      # ============================================
      # 16. Upload APK
      # ============================================
      - uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ============================================
      # 17. Upload Manifest
      # ============================================
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidManifest-Debug
          path: android/app/src/main/AndroidManifest.xml 