name: Build Dev APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development
      EXPO_NO_DEV_SERVER: 1

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Setup Node + PNPM
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 3. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Setup Java
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # 5. Setup Android SDK — dengan packages kosong
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 6. Install NDK + CMake (manual)
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # 7. Install nasm
      - name: Install nasm
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      # 8. Cache FFmpeg build
      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: android/app/src/main/cpp/libs/ffmpeg
          key: ffmpeg-android-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      # 9. Build FFmpeg for Android
      - name: Build FFmpeg for Android
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-android.sh

      # 10. Configure Android paths
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          sdk.dir=$ANDROID_HOME
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # 11. Inject Gradle init script
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # 12. Patch RN Gradle Plugin
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # 13. Setup Oboe
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # 14. Clean native caches
      - name: Clean native caches
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean || true
          rm -rf app/.cxx app/build
          echo "✅ Native caches cleaned"

      # 15. Generate Codegen
      - name: Generate Codegen
        working-directory: android
        run: |
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true

      # 16. Embed Expo bundle
      - name: Embed Expo bundle
        run: |
          echo "📦 Embedding Expo bundle..."
          npx expo export:embed --platform android --dev false \
            --bundle-output android/app/src/main/assets/index.android.bundle

          if [ -f android/app/src/main/assets/index.android.bundle ]; then
            SIZE=$(wc -c < android/app/src/main/assets/index.android.bundle)
            echo "✅ Bundle embedded: $SIZE bytes"
            if grep -q "DUMMY" android/app/src/main/assets/index.android.bundle; then
              echo "✅ 'DUMMY' found in bundle"
            fi
          else
            echo "❌ Bundle embedding failed!"
            exit 1
          fi

      # 17. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes 2>&1 | tee build.log

      # 18. Verify bundle in APK
      - name: Verify bundle in APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✅ index.android.bundle FOUND in APK"
            unzip -l "$APK" | grep "index.android.bundle"
          else
            echo "❌ index.android.bundle NOT found!"
            exit 1
          fi

      # 19. Upload Build Log on Failure
      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-Log
          path: android/build.log
          retention-days: 7

      # 20. Upload APK on Success
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PristineAudio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 