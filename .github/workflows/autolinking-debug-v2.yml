name: Autolinking Debug V2

on:
  workflow_dispatch:

jobs:
  autolinking:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      NODE_ENV: development

    steps:
      # ============================================
      # 1. Checkout
      # ============================================
      - uses: actions/checkout@v4

      # ============================================
      # 2. Setup Node + PNPM
      # ============================================
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================
      # 3. Install dependencies
      # ============================================
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ============================================
      # 4. Setup Java + Android SDK
      # ============================================
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # ============================================
      # 5. Install NDK + CMake
      # ============================================
      - name: Install NDK + CMake
        run: |
          yes | sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # ============================================
      # 6. Configure local.properties (tanpa ndk.dir)
      # ============================================
      - name: Configure Android paths
        run: |
          cat > android/local.properties << EOF
          sdk.dir=$ANDROID_HOME
          cmake.dir=$ANDROID_HOME/cmake/3.22.1
          EOF

      # ============================================
      # 7. Inject Gradle init script (RN + Expo fix)
      # ============================================
      - name: Inject Gradle init script
        run: |
          mkdir -p $GRADLE_USER_HOME/init.d
          cat > $GRADLE_USER_HOME/init.d/rn-plugins.gradle << EOF
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
                  includeBuild("${{ github.workspace }}/node_modules/@react-native/gradle-plugin")
                  includeBuild("${{ github.workspace }}/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
              }
          }
          EOF

      # ============================================
      # 8. Setup Oboe (needed for CMake configure)
      # ============================================
      - name: Setup Oboe
        run: |
          OBOE_DIR="android/app/src/main/cpp/oboe"
          mkdir -p "$OBOE_DIR"
          curl -L https://github.com/google/oboe/archive/refs/tags/1.9.0.tar.gz \
          | tar -xz --strip-components=1 -C "$OBOE_DIR"

      # ============================================
      # 9. Patch RN Gradle Plugin (fix foojay bug)
      # ============================================
      - name: Patch RN Gradle Plugin
        run: |
          FILE=node_modules/@react-native/gradle-plugin/settings.gradle.kts
          if grep -q "foojay-resolver-convention" "$FILE"; then
            sed -i '/foojay-resolver-convention/d' "$FILE"
            echo "✅ Patched foojay"
          else
            echo "✅ Already patched"
          fi

      # ============================================
      # 10. Apply PristineAudio patches
      # ============================================
      - name: Apply PristineAudio patches
        run: bash scripts/patch-pristine.sh

      # ============================================
      # 10b. Apply fixed CMakeLists (Folly fix for RN 0.83)
      # ============================================
      - name: Apply fixed CMakeLists
        run: |
          cat > android/app/src/main/cpp/CMakeLists.txt << 'CMAKE_EOF'
          # =====================================================
          # PristineAudio Native Engine — Enhanced
          # =====================================================

          cmake_minimum_required(VERSION 3.22.1)
          project(pristine-audio VERSION 1.0.0 LANGUAGES CXX)

          # =====================================================
          # C++ STANDARD
          # =====================================================

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          # =====================================================
          # Minimal compatibility for third-party autolinking libraries
          # =====================================================

          function(target_compile_reactnative_options target)
              # no-op
          endfunction()

          # =====================================================
          # BUILD TYPE DEFAULT
          # =====================================================

          if(NOT CMAKE_BUILD_TYPE AND NOT CMAKE_CONFIGURATION_TYPES)
              set(CMAKE_BUILD_TYPE Release CACHE STRING "Build type" FORCE)
              set_property(CACHE CMAKE_BUILD_TYPE PROPERTY STRINGS "Debug" "Release" "MinSizeRel" "RelWithDebInfo")
          endif()

          # =====================================================
          # GLOBAL FLAGS
          # =====================================================

          set(CMAKE_CXX_FLAGS_RELEASE "${CMAKE_CXX_FLAGS_RELEASE} -O3 -DNDEBUG -fomit-frame-pointer")
          set(CMAKE_CXX_FLAGS_DEBUG   "${CMAKE_CXX_FLAGS_DEBUG} -O0 -g3 -fno-omit-frame-pointer")
          set(CMAKE_CXX_FLAGS_RELWITHDEBINFO "${CMAKE_CXX_FLAGS_RELWITHDEBINFO} -O3 -g -DNDEBUG")

          # =====================================================
          # SOURCE COLLECTION
          # =====================================================

          file(GLOB_RECURSE ALL_SRCS CONFIGURE_DEPENDS
              "core/*.cpp"
              "manager/*.cpp"
              "modes/*.cpp"
              "playback/*.cpp"
              "decoder/*.cpp"
              "dsp/*.cpp"
              "dsp/*/*.cpp"
              "fft/*.cpp"
              "devices/*.cpp"
              "usb/*.cpp"
              "realtime/*.cpp"
              "session/*.cpp"
              "profiling/*.cpp"
              "visualizer/*.cpp"
              "utils/*.cpp"
              "jni/*.cpp"
          )

          # =====================================================
          # EXCLUDED SOURCES
          # =====================================================

          set(EXCLUDED_SRCS "")
          file(GLOB_RECURSE TEST_SRCS "tests/*.cpp" "*_test.cpp" "*Test.cpp")
          if(TEST_SRCS)
              list(APPEND EXCLUDED_SRCS ${TEST_SRCS})
          endif()

          # =====================================================
          # FFMPEG DETECTION
          # =====================================================

          option(ENABLE_FFMPEG "Enable FFmpeg decoder support" ON)
          set(PRISTINE_FFMPEG_AVAILABLE FALSE)

          if(ENABLE_FFMPEG)
              find_package(PkgConfig QUIET)
              if(PkgConfig_FOUND)
                  pkg_check_modules(FFMPEG QUIET
                      libavcodec>=58.0
                      libavformat>=58.0
                      libswresample>=3.0
                      libavutil>=56.0
                  )
              endif()
              if(FFMPEG_FOUND)
                  set(PRISTINE_FFMPEG_AVAILABLE TRUE)
              else()
                  message(STATUS "FFmpeg not found via pkg-config, trying manual find...")
                  find_library(AVCODEC_LIB avcodec PATHS \( {CMAKE_SOURCE_DIR}/../libs/ffmpeg/ \){ANDROID_ABI} NO_DEFAULT_PATH)
                  find_library(AVFORMAT_LIB avformat PATHS \( {CMAKE_SOURCE_DIR}/../libs/ffmpeg/ \){ANDROID_ABI} NO_DEFAULT_PATH)
                  find_library(SWRESAMPLE_LIB swresample PATHS \( {CMAKE_SOURCE_DIR}/../libs/ffmpeg/ \){ANDROID_ABI} NO_DEFAULT_PATH)
                  find_library(AVUTIL_LIB avutil PATHS \( {CMAKE_SOURCE_DIR}/../libs/ffmpeg/ \){ANDROID_ABI} NO_DEFAULT_PATH)
                  if(AVCODEC_LIB AND AVFORMAT_LIB)
                      set(PRISTINE_FFMPEG_AVAILABLE TRUE)
                  endif()
              endif()
          endif()

          if(NOT PRISTINE_FFMPEG_AVAILABLE)
              message(WARNING "FFmpeg not found, decoder will use PCM only -- excluding decoder/FFmpegDecoder.cpp from build")
              list(APPEND EXCLUDED_SRCS "${CMAKE_CURRENT_SOURCE_DIR}/decoder/FFmpegDecoder.cpp")
          endif()

          if(EXCLUDED_SRCS)
              list(REMOVE_ITEM ALL_SRCS ${EXCLUDED_SRCS})
          endif()

          # =====================================================
          # OBOE SETUP
          # =====================================================

          set(OBOE_DIR "${CMAKE_CURRENT_SOURCE_DIR}/oboe")
          if(EXISTS "${OBOE_DIR}/CMakeLists.txt")
              message(STATUS "Found Oboe subdirectory at ${OBOE_DIR}")
              add_subdirectory(${OBOE_DIR} oboe EXCLUDE_FROM_ALL)
              set(OBOE_LIB oboe)
          else()
              message(FATAL_ERROR "Oboe not found at ${OBOE_DIR}/CMakeLists.txt")
          endif()

          # =====================================================
          # REACT NATIVE / JSI
          # =====================================================

          find_package(ReactAndroid CONFIG REQUIRED)
          find_package(fbjni CONFIG REQUIRED)

          # =====================================================
          # CODEGEN-GENERATED JNI
          # =====================================================

          set(CODEGEN_JNI_DIR "${CMAKE_CURRENT_SOURCE_DIR}/../../../build/generated/source/codegen/jni")
          if(EXISTS "${CODEGEN_JNI_DIR}/CMakeLists.txt")
              message(STATUS "Found Codegen JNI at ${CODEGEN_JNI_DIR} — include headers only")
              set(CODEGEN_LIB "")
          else()
              message(WARNING "Codegen JNI not found at ${CODEGEN_JNI_DIR}")
          endif()

          add_library(pristine-audio SHARED ${ALL_SRCS})

          if(EXISTS "${CODEGEN_JNI_DIR}")
              target_include_directories(pristine-audio PRIVATE "${CODEGEN_JNI_DIR}")
          endif()

          # =====================================================
          # INCLUDE DIRECTORIES
          # =====================================================

          target_include_directories(pristine-audio
              PRIVATE
                  ${CMAKE_CURRENT_SOURCE_DIR}
                  core
                  manager
                  modes
                  playback
                  decoder
                  dsp
                  dsp/graph
                  dsp/tone
                  dsp/spatial
                  dsp/dynamics
                  dsp/filters
                  dsp/convolution
                  dsp/immersive
                  dsp/headphone
                  fft
                  devices
                  usb
                  realtime
                  session
                  profiling
                  visualizer
                  utils
                  jni
          )

          # =====================================================
          # FFMPEG DECODER
          # =====================================================

          if(PRISTINE_FFMPEG_AVAILABLE)
              if(FFMPEG_FOUND)
                  message(STATUS "FFmpeg found via pkg-config")
                  target_include_directories(pristine-audio PRIVATE ${FFMPEG_INCLUDE_DIRS})
                  target_link_libraries(pristine-audio ${FFMPEG_LIBRARIES})
                  target_compile_definitions(pristine-audio PRIVATE ENABLE_FFMPEG=1)
                  target_compile_options(pristine-audio PRIVATE ${FFMPEG_CFLAGS_OTHER})
              else()
                  message(STATUS "FFmpeg found manually")
                  target_link_libraries(pristine-audio ${AVCODEC_LIB} ${AVFORMAT_LIB} ${SWRESAMPLE_LIB} ${AVUTIL_LIB})
                  target_compile_definitions(pristine-audio PRIVATE ENABLE_FFMPEG=1)
              endif()
          endif()

          # =====================================================
          # COMPILER OPTIONS
          # =====================================================

          target_compile_options(pristine-audio
              PRIVATE
                  -Wall
                  -Wextra
                  -Werror=return-type
                  -Werror=uninitialized
                  -Wno-unused-parameter
                  -Wno-unused-variable
                  -Wno-missing-field-initializers
                  -ffast-math
                  -fstrict-aliasing
                  -fvisibility=hidden
                  -ffunction-sections
                  -fdata-sections
                  -fstack-protector-strong
                  -D_FORTIFY_SOURCE=2
          )

          # =====================================================
          # SIMD / ARCHITECTURE FLAGS
          # =====================================================

          if(ANDROID_ABI STREQUAL "arm64-v8a")
              target_compile_options(pristine-audio PRIVATE -march=armv8-a+fp+simd)
              target_compile_definitions(pristine-audio PRIVATE ARM_NEON=1 __ARM_NEON=1)
          elseif(ANDROID_ABI STREQUAL "armeabi-v7a")
              target_compile_options(pristine-audio PRIVATE -mfloat-abi=softfp -mfpu=neon-vfpv4 -marm)
              target_compile_definitions(pristine-audio PRIVATE ARM_NEON=1 __ARM_NEON=1)
          elseif(ANDROID_ABI STREQUAL "x86_64")
              target_compile_options(pristine-audio PRIVATE -msse4.2 -mavx2)
              target_compile_definitions(pristine-audio PRIVATE X86_SSE=1 X86_AVX2=1)
          elseif(ANDROID_ABI STREQUAL "x86")
              target_compile_options(pristine-audio PRIVATE -msse4.2)
              target_compile_definitions(pristine-audio PRIVATE X86_SSE=1)
          endif()

          # =====================================================
          # LINK OPTIONS
          # =====================================================

          target_link_options(pristine-audio
              PRIVATE
                  -Wl,--gc-sections
                  -Wl,--exclude-libs,ALL
                  -Wl,-z,relro,-z,now
          )

          # =====================================================
          # CONDITIONAL DEFINITIONS
          # =====================================================

          if(CMAKE_BUILD_TYPE STREQUAL "Debug")
              target_compile_definitions(pristine-audio PRIVATE OBOE_ENABLE_LOGGING=1)
          else()
              target_compile_definitions(pristine-audio PRIVATE OBOE_ENABLE_LOGGING=0)
          endif()

          target_compile_definitions(pristine-audio
              PRIVATE
                  PRISTINE_AUDIO_ENGINE=1
                  \( < \)<CONFIG:Debug>:DEBUG_BUILD=1>
                  \( < \)<CONFIG:Release>:RELEASE_BUILD=1>
          )

          # =====================================================
          # PRECOMPILED HEADERS
          # =====================================================

          target_precompile_headers(pristine-audio
              PRIVATE
                  <cstdint>
                  <vector>
                  <memory>
                  <atomic>
                  core/AudioTypes.h
                  core/AudioConstants.h
                  utils/AudioMath.h
          )

          # =====================================================
          # LINK LIBRARIES (pristine-audio)
          # =====================================================

          target_link_libraries(pristine-audio
              PUBLIC
                  ${OBOE_LIB}
              PRIVATE
                  android
                  log
                  ReactAndroid::jsi
                  ${CODEGEN_LIB}
          )

          # =====================================================
          # STRIP SYMBOLS IN RELEASE
          # =====================================================

          if(CMAKE_BUILD_TYPE STREQUAL "Release" OR CMAKE_BUILD_TYPE STREQUAL "MinSizeRel")
              add_custom_command(TARGET pristine-audio POST_BUILD
                  COMMAND ${CMAKE_STRIP} --strip-unneeded $<TARGET_FILE:pristine-audio>
                  COMMENT "Stripping symbols for release..."
              )
          endif()

          # =====================================================
          # EXPORT COMPILE COMMANDS
          # =====================================================

          set(CMAKE_EXPORT_COMPILE_COMMANDS ON)

          # =====================================================
          # APPMODULES TARGET
          # =====================================================

          set(AUTOLINKING_CMAKE "${CMAKE_CURRENT_SOURCE_DIR}/../../../build/generated/autolinking/src/main/jni/Android-autolinking.cmake")

          if(EXISTS "${AUTOLINKING_CMAKE}")
              message(STATUS "Found autolinking cmake at ${AUTOLINKING_CMAKE}")
              include("${AUTOLINKING_CMAKE}")
          else()
              message(WARNING "Autolinking cmake not found — appmodules will be built without third-party TurboModules")
              set(AUTOLINKED_LIBRARIES "")
          endif()

          set(PRISTINE_AUDIO_SPEC_LIB "")
          if(EXISTS "${CODEGEN_JNI_DIR}/CMakeLists.txt")
              add_subdirectory("${CODEGEN_JNI_DIR}" pristineaudiospec_codegen_build EXCLUDE_FROM_ALL)
              set(PRISTINE_AUDIO_SPEC_LIB react_codegen_PristineAudioSpec)
          endif()

          add_library(appmodules SHARED
              "${CMAKE_CURRENT_SOURCE_DIR}/../../../src/main/jni/OnLoad.cpp"
          )

          # Di RN 0.76+ Folly sudah tersedia melalui ReactAndroid::reactnative
          target_include_directories(appmodules PRIVATE
              "${CODEGEN_JNI_DIR}"
          )

          target_link_libraries(appmodules
              PRIVATE
                  ${AUTOLINKED_LIBRARIES}
                  ${PRISTINE_AUDIO_SPEC_LIB}
                  ReactAndroid::reactnative
                  ReactAndroid::jsi
                  fbjni::fbjni
                  android
                  log
          )
          CMAKE_EOF
          echo "✅ Fixed CMakeLists.txt applied"

      # ============================================
      # 11. Run generateAutolinkingNewArchitectureFiles
      # ============================================
      - name: Run generateAutolinkingNewArchitectureFiles
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateAutolinkingNewArchitectureFiles \
            --no-daemon \
            --rerun-tasks \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true 2>&1 | tee autolinking.log
          echo ""
          echo "=== Task status summary ==="
          grep -E "generateAutolinkingNewArchitectureFiles|BUILD SUCCESSFUL|BUILD FAILED|SKIPPED|UP-TO-DATE" autolinking.log || echo "No matching output"

      # ============================================
      # 12. Locate and inspect autolinking artifacts
      # ============================================
      - name: Locate autolinking artifacts
        if: always()
        working-directory: android
        run: |
          echo "=== Searching for autolinking output ==="
          find app/build -iname "*autolink*" 2>/dev/null || echo "none found"
          echo ""
          echo "=== Searching for Android-autolinking.cmake anywhere ==="
          find . -iname "Android-autolinking.cmake" 2>/dev/null || echo "none found"
          echo ""
          echo "=== Full tree of build/generated (depth 5) ==="
          find app/build/generated -maxdepth 5 2>/dev/null || echo "app/build/generated does not exist"
          echo ""
          echo "=== Searching for appmodules references anywhere in build ==="
          grep -rl "appmodules" app/build 2>/dev/null || echo "none found"

      # ============================================
      # 13. Dump content of autolinking cmake file (if found)
      # ============================================
      - name: Show autolinking cmake content
        if: always()
        working-directory: android
        run: |
          FOUND=$(find . -iname "Android-autolinking.cmake" 2>/dev/null | head -1)
          if [ -n "$FOUND" ]; then
            echo "=== Found at: $FOUND ==="
            cat "$FOUND"
          else
            echo "No Android-autolinking.cmake file found anywhere in the project."
          fi

      # ============================================
      # 13b. Dump app's own Codegen spec CMakeLists.txt
      # ============================================
      - name: Show Codegen spec CMakeLists content
        if: always()
        working-directory: android
        run: |
          FILE="app/build/generated/source/codegen/jni/CMakeLists.txt"
          if [ -f "$FILE" ]; then
            echo "=== Found at: $FILE ==="
            cat "$FILE"
          else
            echo "Not found at $FILE"
            echo "=== Searching elsewhere ==="
            find app/build/generated/source/codegen -iname "CMakeLists.txt" 2>/dev/null || echo "none found"
          fi
          echo ""
          echo "=== PristineAudioSpec.h (first 60 lines) ==="
          find app/build/generated/source/codegen -iname "PristineAudioSpec.h" -exec head -60 {} \; 2>/dev/null || echo "not found"

      # ============================================
      # 13c. Show autolinking.cpp / autolinking.h content
      # ============================================
      - name: Show autolinking.cpp and autolinking.h content
        if: always()
        working-directory: android
        run: |
          DIR="app/build/generated/autolinking/src/main/jni"
          if [ -f "$DIR/autolinking.h" ]; then
            echo "=== autolinking.h ==="
            cat "$DIR/autolinking.h"
          else
            echo "autolinking.h not found at $DIR"
          fi
          echo ""
          if [ -f "$DIR/autolinking.cpp" ]; then
            echo "=== autolinking.cpp ==="
            cat "$DIR/autolinking.cpp"
          else
            echo "autolinking.cpp not found at $DIR"
          fi

      # ============================================
      # 14. Write OnLoad.cpp for appmodules target
      # ============================================
      - name: Write appmodules OnLoad.cpp
        run: |
          mkdir -p android/app/src/main/jni
          cat > android/app/src/main/jni/OnLoad.cpp << 'ONLOAD_EOF'
          #include <DefaultComponentsRegistry.h>
          #include <DefaultTurboModuleManagerDelegate.h>
          #include <ReactCommon/CallInvokerHolder.h>
          #include <autolinking.h>
          #include <fbjni/fbjni.h>
          #include <react/renderer/componentregistry/ComponentDescriptorProviderRegistry.h>
          #include <rncore.h>

          #include "PristineAudioSpec.h"

          namespace facebook::react {

          std::shared_ptr<TurboModule> appModulesModuleProvider(
              const std::string& moduleName,
              const JavaTurboModule::InitParams& params) {
            auto pristineAudioModule = PristineAudioSpec_ModuleProvider(moduleName, params);
            if (pristineAudioModule != nullptr) {
              return pristineAudioModule;
            }
            return autolinking_ModuleProvider(moduleName, params);
          }

          std::shared_ptr<TurboModule> appModulesClassModuleProvider(
              const std::string& moduleName,
              const JavaTurboModule::InitParams& params) {
            return rncore_ModuleProvider(moduleName, params);
          }

          std::shared_ptr<TurboModule> appModulesCxxModuleProvider(
              const std::string& moduleName,
              const std::shared_ptr<CallInvoker>& jsInvoker) {
            return autolinking_cxxModuleProvider(moduleName, jsInvoker);
          }

          void appModulesRegisterComponentDescriptorsFromEntryPoint(
              std::shared_ptr<const ComponentDescriptorProviderRegistry> registry) {
            autolinking_registerProviders(registry);
          }

          } // namespace facebook::react

          extern "C" JNIEXPORT void JNICALL
          Java_com_facebook_react_defaults_DefaultReactNativeHost_00024Companion_loadReactNative(
              JNIEnv* env,
              jobject thiz) {
            facebook::react::DefaultTurboModuleManagerDelegate::setModuleProvidersFunction(
                &facebook::react::appModulesModuleProvider,
                &facebook::react::appModulesClassModuleProvider,
                &facebook::react::appModulesCxxModuleProvider);
            facebook::react::DefaultComponentsRegistry::
                setComponentDescriptorProviderRegistryFunction(
                    &facebook::react::appModulesRegisterComponentDescriptorsFromEntryPoint);
          }
          ONLOAD_EOF
          echo "=== OnLoad.cpp written ==="
          cat android/app/src/main/jni/OnLoad.cpp

      # ============================================
      # 15. Generate app's own Codegen spec
      # ============================================
      - name: Generate Codegen
        working-directory: android
        run: |
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            --rerun-tasks \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true
          echo "=== Confirm PristineAudioSpec.h exists ==="
          find app/build/generated/source/codegen -iname "PristineAudioSpec.h" || echo "NOT FOUND"

      # ============================================
      # 15b. Clean native caches before full build
      # ============================================
      - name: Clean CMake & native caches
        working-directory: android
        run: |
          ./gradlew clean || true
          rm -rf app/.cxx app/build/.cxx
          rm -rf $GRADLE_USER_HOME/caches/transforms-* || true
          echo "✅ Native caches cleaned"

      # ============================================
      # 16. Full build — test appmodules compiles and links
      # ============================================
      - name: Build Debug APK (test appmodules target)
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            -PnewArchEnabled=true \
            -PreactNativeNewArch=true \
            -PhermesEnabled=true \
            -DJS_RUNTIME=hermes 2>&1 | tee appmodules-build.log
          echo "exit code: $?"

      # ============================================
      # 17. Filter build log for appmodules-specific results
      # ============================================
      - name: Show appmodules build result
        if: always()
        working-directory: android
        run: |
          echo "=== BUILD SUCCESSFUL / BUILD FAILED ==="
          grep -E "BUILD SUCCESSFUL|BUILD FAILED" appmodules-build.log || echo "no final status found"
          echo ""
          echo "=== appmodules-related compile/link lines ==="
          grep -n -i "appmodules\|PristineAudioSpec_ModuleProvider\|target_compile_reactnative_options\|DefaultTurboModuleManagerDelegate\|DefaultComponentsRegistry" appmodules-build.log || echo "no appmodules-related lines found"
          echo ""
          echo "=== Any C++ errors ==="
          grep -n -B2 -A5 "error:" appmodules-build.log || echo "no C++ errors found"
          echo ""
          echo "=== CMake errors ==="
          grep -n -B2 -A5 "CMake Error" appmodules-build.log || echo "no CMake errors found"
          echo ""
          echo "=== Checking if libappmodules.so was actually produced ==="
          find app/build -iname "libappmodules.so" || echo "libappmodules.so NOT produced"

      # ============================================
      # 18. Upload appmodules build log
      # ============================================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Appmodules-Build-Log
          path: android/appmodules-build.log

      # ============================================
      # 19. Upload autolinking log
      # ============================================
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Autolinking-Debug-Log
          path: android/autolinking.log