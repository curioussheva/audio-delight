jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space (optional but good)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 1. Setup Android SDK FIRST
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 2. Accept licenses & create local.properties BEFORE prebuild
      - name: Accept SDK licenses & configure local.properties
        run: |
          # Accept all licenses (required in clean CI)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Create local.properties (critical!)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # Debug: show content in log
          echo "local.properties content:"
          cat android/local.properties || echo "Failed to create local.properties"
          
          # Export to env for safety
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      # 3. NOW run prebuild (SDK is ready)
      - name: Expo Prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      # 4. Build APK
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7 