name: Build PristineAudio APK (Debug)

on:
  push:
    branches: [ "pristine-audio" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Pin Gradle to 8.7
        run: |
          sed -i 's|gradle-[0-9][0-9]*\.[0-9][0-9]*\(\.[0-9][0-9]*\)\?-bin\.zip|gradle-8.7-bin.zip|g' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch settings.gradle for CI
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          FILE_PATH="android/settings.gradle"
          
          # 1. Bersihkan total file asli dari blok-blok sensitif agar tidak duplikasi
          # Kami menghapus blok pluginManagement dan includeBuild yang lama
          sed -i '/pluginManagement {/,/}/d' "$FILE_PATH"
          sed -i '/includeBuild.*gradle-plugin/d' "$FILE_PATH"
          
          # 2. Re-build file dari nol dengan urutan SAKRAL (Tanpa spasi di baris 1)
          cat <<EOF > settings.new
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
includeBuild("${ROOT_DIR}/node_modules/@react-native/gradle-plugin")
EOF
          # Tambahkan sisa konten asli
          cat "$FILE_PATH" >> settings.new
          
          # 3. Hapus baris kosong yang mungkin muncul di paling atas (Critical Fix)
          sed -i './,/^$/ { /^$/d }' settings.new
          
          mv settings.new "$FILE_PATH"
          
          echo "--- Verifikasi Nomor Baris (Harus pluginManagement di baris 1) ---"
          cat -n "$FILE_PATH" | head -n 20

      - name: Patch Android Build Files
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          # Patch build.gradle utama
          sed -i "/repositories {/a \        maven { url \"$ROOT_DIR/node_modules/react-native-track-player/android/repo\" }" android/build.gradle
          
          # Patch app/build.gradle
          sed -i "/defaultConfig {/a \        ndk { abiFilters 'arm64-v8a' }" android/app/build.gradle
          
          echo "✅ Android build files patched"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            -PkotlinVersion=2.0.21 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
