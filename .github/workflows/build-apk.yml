name: Build PristineAudio APK (Optimized)

on:
  push:
    branches: [ "pristine-audio" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Prebuild dengan --clean untuk pastikan expo-router baru terintegrasi benar
      - name: Expo Prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Patch Android Build Files (jika masih pakai custom maven)
        run: |
          ROOT_DIR="${{ github.workspace }}"
          
          # Patch repositories jika diperlukan (untuk react-native-track-player & async-storage)
          sed -i "/allprojects {/a \    repositories {\n        maven { url \"$ROOT_DIR/node_modules/react-native-track-player/android/repo\" }\n        maven { url \"$ROOT_DIR/node_modules/@react-native-async-storage/async-storage/android/libs\" }\n    }" android/build.gradle
          
          echo "✅ Android build files patched"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            -PkotlinVersion=2.0.21 \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms1g -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7 