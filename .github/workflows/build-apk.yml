name: Build PristineAudio APK (Optimized)

on:
  push:
    branches: [ "pristine-audio" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Mengaktifkan cache Gradle otomatis dari action resmi
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Optimasi: Prebuild hanya jika folder android tidak ada atau butuh pembersihan
      - name: Expo Prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Patch Android Build Files
        run: |
          # Menggunakan path yang lebih dinamis agar tidak hardcoded total
          ROOT_DIR="${{ github.workspace }}"
          
          # Patch build.gradle (allprojects) agar lebih stabil mencari libs
          sed -i "/repositories {/a \        maven { url \"$ROOT_DIR/node_modules/@react-native-async-storage/async-storage/android/libs\" }" android/build.gradle
          sed -i "/repositories {/a \        maven { url \"$ROOT_DIR/node_modules/react-native-track-player/android/repo\" }" android/build.gradle
          
          # Patch app/build.gradle untuk flatDir
          sed -i "/repositories {/a \        flatDir { dirs \"$ROOT_DIR/node_modules/@react-native-async-storage/async-storage/android/libs\" }" android/app/build.gradle
          
          echo "✅ Android build files patched successfully"
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Optimasi Flags: 
          # --no-daemon (wajib di CI)
          # --build-cache (mempercepat build berikutnya)
          # -Xmx (menghindari OOM / Out of Memory)
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            -PkotlinVersion=2.0.21 \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms1g -XX:+HeapDumpOnOutOfMemoryError"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7 