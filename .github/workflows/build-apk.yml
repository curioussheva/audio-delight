name: Build PristineAudio APK (Debug)

on:
  push:
    branches: [ "pristine-audio" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3[0-2]*
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk after cleanup:"
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Pin Gradle to 8.7
        run: |
          sed -i 's|gradle-[0-9][0-9]*\.[0-9][0-9]*\(\.[0-9][0-9]*\)\?-bin\.zip|gradle-8.7-bin.zip|g' \
            android/gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper updated to 8.7"

      - name: Patch settings.gradle for CI
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          FILE_PATH="android/settings.gradle"
          
          # 1. Ambil isi asli file tapi buang baris includeBuild yang bermasalah
          sed -i '/includeBuild.*react-native\/gradle-plugin/d' "$FILE_PATH"
          
          # 2. Buat file settings baru dengan urutan yang BENAR
          # Baris 1: pluginManagement (WAJIB PERTAMA)
          echo "pluginManagement { repositories { gradlePluginPortal(); google(); mavenCentral() } }" > settings.new
          
          # Baris 2: includeBuild (Daftarkan plugin lokal)
          echo "includeBuild(\"${ROOT_DIR}/node_modules/@react-native/gradle-plugin\")" >> settings.new
          
          # Baris selanjutnya: Isi asli settings.gradle (yang mengandung blok plugins {})
          cat "$FILE_PATH" >> settings.new
          
          # 3. Timpa file asli
          mv settings.new "$FILE_PATH"
          
          echo "--- Final settings.gradle (Correct Order) ---"
          cat "$FILE_PATH"

      - name: Patch Android Build Files
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          # Tambahkan maven repositori manual untuk library yang sulit di-resolve
          sed -i "/repositories {/a \        maven { url \"$ROOT_DIR/node_modules/@react-native-async-storage/async-storage/android/libs\" }" android/build.gradle
          sed -i "/repositories {/a \        maven { url \"$ROOT_DIR/node_modules/react-native-track-player/android/repo\" }" android/build.gradle
          
          # Tambahkan flatDir untuk library AAR
          sed -i "/repositories {/a \        flatDir { dirs \"$ROOT_DIR/node_modules/@react-native-async-storage/async-storage/android/libs\" }" android/app/build.gradle
          
          # Batasi ABI ke arm64-v8a untuk mempercepat build
          sed -i "/defaultConfig {/a \        ndk { abiFilters 'arm64-v8a' }" android/app/build.gradle

          echo "✅ Android build files patched successfully"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --build-cache \
            -PkotlinVersion=2.0.21 \
            -Dorg.gradle.jvmargs="-Xmx3g -Xms512m -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
