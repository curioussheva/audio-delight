name: Build PristineAudio APK (Debug)

on:
  push:
    branches: [ "pristine-audio" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          df -h

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Pin Gradle to 8.7
        run: |
          sed -i 's|gradle-[0-9][0-9]*\.[0-9][0-9]*\(\.[0-9][0-9]*\)\?-bin\.zip|gradle-8.7-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch settings.gradle for CI
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          FILE_PATH="android/settings.gradle"
          
          # Ambil isi file HANYA mulai dari tulisan "plugins {" sampai ke bawah
          sed -n '/plugins {/,$p' "$FILE_PATH" > settings.tail
          
          # Buat kepala file yang baru, bersih, dan statis
          echo "pluginManagement {" > settings.new
          # KUNCI JAWABANNYA: includeBuild diletakkan DI DALAM pluginManagement
          echo "    includeBuild(\"${ROOT_DIR}/node_modules/@react-native/gradle-plugin\")" >> settings.new
          echo "    repositories {" >> settings.new
          echo "        google()" >> settings.new
          echo "        mavenCentral()" >> settings.new
          echo "        gradlePluginPortal()" >> settings.new
          echo "    }" >> settings.new
          echo "}" >> settings.new
          
          # Sambungkan dengan sisa file asli
          cat settings.tail >> settings.new
          
          # Timpa file lama
          mv settings.new "$FILE_PATH"
          echo "--- Verifikasi Struktur settings.gradle ---"
          cat -n "$FILE_PATH" | head -n 20

      - name: Patch Android Build Files
        env:
          ROOT_DIR: ${{ github.workspace }}
        run: |
          # Menyisipkan maven di dalam kurung kurawal 'repositories {'
          sed -i "s|repositories {|repositories { maven { url \"${ROOT_DIR}/node_modules/react-native-track-player/android/repo\" }|g" android/build.gradle
          
          # Menyisipkan abiFilters secara inline di dalam 'defaultConfig {'
          sed -i "s|defaultConfig {|defaultConfig { ndk { abiFilters 'arm64-v8a' }|g" android/app/build.gradle
          
          echo "✅ Android build files patched"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            -PkotlinVersion=2.0.21 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PristineAudio-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
