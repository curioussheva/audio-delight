name: Build PristineAudio APK (No Updates)

on:
  push:
    branches: [ "pristine-audio" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # ⭐ KOMENTAR DARI REMOTE (lebih deskriptif)
      - name: Clean android folder
        run: rm -rf android

      - name: Run Expo Prebuild
        run: npx expo prebuild --clean --non-interactive

      - name: Patch Android Build Files
        run: |
          # 1. Paksa lokasi Maven untuk AsyncStorage & Track Player di level root
          # Menggunakan sed untuk menyisipkan repositori lokal tepat setelah google()
          sed -i '/google()/a \        maven { url "${{ github.workspace }}/node_modules/@react-native-async-storage/async-storage/android/libs" }' android/build.gradle
          sed -i '/google()/a \        maven { url "${{ github.workspace }}/node_modules/react-native-track-player/android/repo" }' android/build.gradle
          
          # 2. Tambahkan flatDir sebagai cadangan (Fallback) agar file .aar terbaca tanpa .pom
          sed -i '/repositories {/a \        flatDir { dirs "${{ github.workspace }}/node_modules/@react-native-async-storage/async-storage/android/libs" }' android/app/build.gradle
          
          echo "✅ Android build files patched with local paths"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          # Menambahkan JVM args untuk stabilitas memori di GitHub Runner
          ./gradlew assembleRelease \
            --no-daemon \
            -PkotlinVersion=2.0.21 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --stacktrace
