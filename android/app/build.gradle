apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// =============================================
// REACT CONFIG
// =============================================

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"]
        .execute(null, rootDir).text.trim())

    reactNativeDir = new File(
        ["node", "--print", "require.resolve('react-native/package.json')"]
            .execute(null, rootDir).text.trim()
    ).getParentFile().getAbsoluteFile()

    codegenDir = new File(
        ["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"]
            .execute(null, rootDir).text.trim()
    ).getParentFile().getAbsoluteFile()

    cliFile = new File(
        ["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"]
            .execute(null, rootDir).text.trim()
    )

    bundleCommand = "export:embed"
    debuggableVariants = []

    autolinkLibrariesWithApp()
}

// =============================================
// ANDROID CONFIG
// =============================================

android {
    namespace 'com.pristineaudio.app'

    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion ?: "27.1.12297006"

    defaultConfig {
        applicationId 'com.pristineaudio.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0.37"

        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
        buildConfigField "boolean", "IS_HERMES_ENABLED", "true"
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false

            pickFirst '**/libc++_shared.so'
            pickFirst '**/libfbjni.so'
            pickFirst '**/libjsi.so'
            pickFirst '**/libreactnative.so'
            pickFirst '**/libreact_featureflagsjni.so'
            pickFirst '**/libturbomodulejsijni.so'
            pickFirst '**/libfolly_runtime.so'
        }

        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

// =============================================
// DEPENDENCIES
// =============================================

dependencies {
    implementation("com.facebook.react:react-android")

    implementation("com.facebook.react:hermes-android")

    def media3Version = "1.6.1"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-decoder:$media3Version"
}
 