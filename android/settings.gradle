pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    
    // Gunakan settingsDir untuk memastikan path absolut dari lokasi file ini
    def nodeModules = new File(settingsDir, "../node_modules")
    
    includeBuild(new File(nodeModules, "@react-native/gradle-plugin"))
    includeBuild(new File(nodeModules, "expo-modules-autolinking/android/expo-gradle-plugin"))
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}

expoAutolinking.useExpoModules()

rootProject.name = 'PristineAudio'

include ':app'
 