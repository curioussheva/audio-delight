pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    def nodeModules = new File(settingsDir, "../node_modules")

    includeBuild(new File(nodeModules, "@react-native/gradle-plugin"))

    // expo-gradle-plugin ada di nested node_modules milik expo, bukan root
    def expoGradlePlugin = new File(nodeModules, "expo/node_modules/expo-modules-autolinking/android/expo-gradle-plugin")
    if (!expoGradlePlugin.exists()) {
        // fallback ke root node_modules jika suatu saat di-hoist
        expoGradlePlugin = new File(nodeModules, "expo-modules-autolinking/android/expo-gradle-plugin")
    }
    println "expo-gradle-plugin path: ${expoGradlePlugin.absolutePath} (exists: ${expoGradlePlugin.exists()})"
    includeBuild(expoGradlePlugin)
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}

expoAutolinking.useExpoModules()

rootProject.name = 'PristineAudio'

include ':app' 