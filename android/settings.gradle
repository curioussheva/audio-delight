pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Memuat plugin autolinking expo secara manual
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Mencoba mencari gradle plugin secara langsung di node_modules
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

// Terapkan pengaturan React Native menggunakan script bawaan mereka
apply from: new File(rootDir, "../node_modules/@react-native/gradle-plugin/settings-plugin.gradle")
apply from: new File(rootDir, "../node_modules/expo-modules-autolinking/android/expo-gradle-plugin/settings-plugin.gradle")

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}

expoAutolinking.useExpoModules()

rootProject.name = 'PristineAudio'

include ':app'
 