pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    
    // Pastikan path benar-benar menunjuk ke folder yang memiliki build.gradle milik plugin
    def rnPluginFolder = file("../node_modules/@react-native/gradle-plugin")
    def expoPluginFolder = file("../node_modules/expo-modules-autolinking/android/expo-gradle-plugin")

    if (rnPluginFolder.exists()) {
        includeBuild(rnPluginFolder)
    }
    if (expoPluginFolder.exists()) {
        includeBuild(expoPluginFolder)
    }
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}

expoAutolinking.useExpoModules()

rootProject.name = 'PristineAudio'

include ':app'
 