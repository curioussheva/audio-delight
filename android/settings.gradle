pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url("${rootDir}/../node_modules/react-native/android")
        }
    }
    
    def nodeModules = new File(settingsDir, "../node_modules")
    includeBuild(new File(nodeModules, "@react-native/gradle-plugin"))
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(["node", "--print", "require('expo-modules-core/android/autolinking.js')"])
}

rootProject.name = 'PristineAudio'

include ':app'
