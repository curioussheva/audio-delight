buildscript {
    ext {
        // Konsisten dengan gradle.properties dan workflow
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: "35.0.0"
        minSdkVersion = findProperty('android.minSdkVersion')?.toInteger() ?: 24
        compileSdkVersion = findProperty('android.compileSdkVersion')?.toInteger() ?: 35
        targetSdkVersion = findProperty('android.targetSdkVersion')?.toInteger() ?: 35
        ndkVersion = findProperty('android.ndkVersion') ?: "27.1.12297006"
        kotlinVersion = findProperty('android.kotlinVersion') ?: "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Versi Gradle Plugin yang stabil untuk NDK 27
        classpath('com.android.tools.build:gradle:8.2.1')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath('com.facebook.react:react-native-gradle-plugin')
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        
        // Tambahkan repository extra untuk Track Player jika ada di gradle.properties
        def extraMavenRepos = findProperty('android.extraMavenRepos')
        if (extraMavenRepos) {
            def repos = new groovy.json.JsonSlurper().parseText(extraMavenRepos)
            repos.each { repo -> maven { url repo.url } }
        }
    }
}

// Plugin root wajib untuk integrasi Expo & RN
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
 