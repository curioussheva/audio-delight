buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: "36.0.0"
        minSdkVersion = findProperty('android.minSdkVersion')?.toInteger() ?: 24
        compileSdkVersion = findProperty('android.compileSdkVersion')?.toInteger() ?: 36
        targetSdkVersion = findProperty('android.targetSdkVersion')?.toInteger() ?: 36
        ndkVersion = findProperty('android.ndkVersion') ?: "27.1.12297006"
        kotlinVersion = findProperty('android.kotlinVersion') ?: "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.0')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        
        // Repository untuk React Native Track Player & lib lainnya
        def extraMavenRepos = findProperty('android.extraMavenRepos')
        if (extraMavenRepos) {
            try {
                def repos = new groovy.json.JsonSlurper().parseText(extraMavenRepos)
                repos.each { repo -> maven { url repo.url } }
            } catch (Exception e) {
                // Mencegah build gagal jika JSON tidak valid
            }
        }
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
 