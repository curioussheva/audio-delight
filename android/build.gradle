buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        kotlinVersion = "2.0.21"
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.2.1') 
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url "$rootDir/../node_modules/react-native-track-player/android/repo" }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.media3:media3-extractor:1.9.1'
            force 'androidx.media3:media3-common:1.9.1'
            force 'androidx.media3:media3-datasource:1.9.1'
            force 'androidx.media3:media3-decoder:1.9.1'
            force 'androidx.media3:media3-exoplayer:1.9.1'
        }
        exclude group: 'com.github.MissingCore.media', module: 'media3-extractor'
        exclude group: 'com.github.MissingCore.media', module: 'media3-common'
        exclude group: 'com.github.MissingCore.media', module: 'media3-datasource'
        exclude group: 'com.github.MissingCore.media', module: 'media3-decoder'
        exclude group: 'com.github.MissingCore.media', module: 'media3-exoplayer'
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"